<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>يوسف فارسي - إدارة دواجن كوب 500</title>
    <!-- استيراد خطوط جوجل الفخمة -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Aref+Ruqaa:wght@700&family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg-color: #0a0f0d;
            --card-bg: rgba(16, 24, 20, 0.85);
            --neon-green: #39ff14;
            --gold-cobb: #ffd700;
            --text-main: #ffffff;
            --text-muted: #a0aec0;
            --border-neon: rgba(57, 255, 20, 0.3);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Cairo', sans-serif;
        }

        body {
            background-color: var(--bg-color);
            background-image: radial-gradient(circle at 50% 50%, #112217 0%, #0a0f0d 100%);
            color: var(--text-main);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
        }

        /* الهيدر والعنوان الفخم */
        header {
            text-align: center;
            margin-bottom: 40px;
            padding: 20px;
            border-bottom: 2px dashed var(--border-neon);
            position: relative;
        }

        .main-title {
            font-family: 'Aref Ruqaa', serif;
            font-size: 3.5rem;
            color: var(--gold-cobb);
            text-shadow: 0 0 20px rgba(255, 215, 0, 0.6), 0 0 40px rgba(255, 215, 0, 0.3);
            letter-spacing: 2px;
            margin-bottom: 5px;
            animation: pulse 3s infinite alternate;
        }

        .sub-title {
            font-size: 1.4rem;
            font-weight: 900;
            color: var(--neon-green);
            text-transform: uppercase;
            letter-spacing: 1px;
            text-shadow: 0 0 10px rgba(57, 255, 20, 0.5);
        }

        /* خانة إدخال اليوم */
        .search-zone {
            background: var(--card-bg);
            border: 1px solid var(--border-neon);
            border-radius: 15px;
            padding: 30px;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
            backdrop-filter: blur(4px);
            text-align: center;
            margin-bottom: 30px;
            transition: all 0.3s ease;
        }

        .search-zone:hover {
            box-shadow: 0 0 25px rgba(57, 255, 20, 0.2);
            border-color: var(--neon-green);
        }

        .search-zone label {
            display: block;
            font-size: 1.2rem;
            margin-bottom: 15px;
            color: var(--text-main);
            font-weight: bold;
        }

        .input-group {
            display: flex;
            justify-content: center;
            gap: 15px;
            max-width: 500px;
            margin: 0 auto;
        }

        input[type="number"] {
            width: 120px;
            background: #000;
            border: 2px solid var(--border-neon);
            border-radius: 10px;
            color: var(--neon-green);
            font-size: 1.8rem;
            font-weight: bold;
            text-align: center;
            outline: none;
            transition: 0.3s;
        }

        input[type="number"]:focus {
            border-color: var(--neon-green);
            box-shadow: 0 0 15px var(--neon-green);
        }

        button {
            background: linear-gradient(135deg, #1f402b 0%, #0d2617 100%);
            color: var(--neon-green);
            border: 1px solid var(--neon-green);
            padding: 10px 25px;
            font-size: 1.1rem;
            font-weight: bold;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        button:hover {
            background: var(--neon-green);
            color: #000;
            box-shadow: 0 0 20px var(--neon-green);
            transform: scale(1.05);
        }

        /* لوحة عرض البيانات الذكية */
        .dashboard-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .data-card {
            background: rgba(10, 15, 13, 0.9);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-right: 4px solid var(--neon-green);
            border-radius: 8px;
            padding: 20px;
            text-align: center;
            transition: transform 0.2s;
        }

        .data-card.gold-border {
            border-right-color: var(--gold-cobb);
        }

        .data-card:hover {
            transform: translateY(-5px);
        }

        .data-card h3 {
            font-size: 0.9rem;
            color: var(--text-muted);
            margin-bottom: 10px;
        }

        .data-card p {
            font-size: 1.6rem;
            font-weight: bold;
            color: var(--text-main);
        }

        /* قسم النصائح والذكاء الاصطناعي */
        .insights-section {
            background: var(--card-bg);
            border: 1px solid var(--border-neon);
            border-radius: 15px;
            padding: 30px;
            margin-bottom: 30px;
            display: none; /* يظهر عند البحث */
        }

        .section-title {
            font-size: 1.3rem;
            color: var(--gold-cobb);
            margin-bottom: 20px;
            border-bottom: 1px solid rgba(255,255,255,0.1);
            padding-bottom: 10px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .tips-list {
            list-style: none;
        }

        .tips-list li {
            position: relative;
            padding-right: 25px;
            margin-bottom: 15px;
            line-height: 1.7;
            color: #e2e8f0;
        }

        .tips-list li::before {
            content: "⚡";
            position: absolute;
            right: 0;
            color: var(--neon-green);
        }

        /* زر ومساحة الـ AI */
        .ai-consultation {
            margin-top: 25px;
            padding-top: 20px;
            border-top: 1px dashed rgba(57, 255, 20, 0.2);
            text-align: center;
        }

        .ai-box {
            background: #000;
            border: 1px solid #1a3a25;
            border-radius: 8px;
            padding: 20px;
            margin-top: 15px;
            text-align: right;
            min-height: 50px;
            color: #4ade80;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            line-height: 1.6;
            display: none;
            white-space: pre-line;
        }

        .loading-effect {
            display: inline-block;
            animation: blink 1s infinite;
        }

        /* أنيميشن */
        @keyframes pulse {
            0% { transform: scale(1); }
            100% { transform: scale(1.02); }
        }
        @keyframes blink {
            0%, 100% { opacity: 0; }
            50% { opacity: 1; }
        }

        @media (max-width: 600px) {
            .main-title { font-size: 2.3rem; }
            .input-group { flex-direction: column; align-items: center; }
            input[type="number"] { width: 100%; }
            button { width: 100%; justify-content: center; }
        }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1 class="main-title">فارسي يوسف</h1>
        <div class="sub-title">تطبيق إدارة دواجن اللحم 🐔 كوب 500</div>
    </header>

    <main>
        <!-- قسم إدخال اليوم -->
        <section class="search-zone">
            <label for="dayInput">أدخل عمر القطيع الحالي (من 1 إلى 45 يوم):</label>
            <div class="input-group">
                <input type="number" id="dayInput" min="1" max="45" placeholder="اليوم">
                <button onclick="getDailyData()">استخراج البيانات الذكية ⚡</button>
            </div>
        </section>

        <!-- لوحة عرض النتائج والمعلومات -->
        <section id="insightsSection" class="insights-section">
            <h2 class="section-title" id="displayDayTitle">📋 بيانات اليوم الحالي</h2>
            
            <div class="dashboard-grid">
                <div class="data-card">
                    <h3>درجة الحرارة المطلوبة</h3>
                    <p id="tempVal">--</p>
                </div>
                <div class="data-card gold-border">
                    <h3>وزن Cobb 500 المستهدف</h3>
                    <p id="weightVal">--</p>
                </div>
                <div class="data-card">
                    <h3>نوع العلف</h3>
                    <p id="feedType">--</p>
                </div>
                <div class="data-card gold-border">
                    <h3>استهلاك العلف اليومي / طائر</h3>
                    <p id="feedAmount">--</p>
                </div>
            </div>

            <h2 class="section-title">💡 الإرشادات والنصائح الحركية</h2>
            <ul id="tipsList" class="tips-list">
                <!-- الإرشادات تضاف هنا عبر الجافاسكريبت -->
            </ul>

            <!-- قسم الاتصال بالذكاء الاصطناعي الخارجي -->
            <div class="ai-consultation">
                <button id="aiBtn" onclick="connectToGroqAI()" style="margin: 0 auto; border-color: var(--gold-cobb); color: var(--gold-cobb);">
                    🤖 استشارة الذكاء الاصطناعي الحيّة لهذا اليوم
                </button>
                <div id="aiResponseBox" class="ai-box"></div>
            </div>
        </section>
    </main>
</div>

<script>
    // قاعدة البيانات الثابتة لكتالوج Cobb 500 والتحصينات لـ 45 يوم
    function generateCobbData(day) {
        let data = {
            temp: "22°C",
            weight: "2500 غ",
            feedType: "ناهي (19% بروتين)",
            feedAmount: "170 غ",
            tips: []
        };

        if (day >= 1 && day <= 3) {
            data.temp = "33°C - 32°C";
            data.weight = (day == 1) ? "42 غ" : (day == 2) ? "55 غ" : "70 غ";
            data.feedType = "بادي (23% بروتين)";
            data.feedAmount = "12 - 15 غ";
            data.tips = [
                "تأكد من توزيع المساقي والمعالف بشكل ممتاز وقريب من الكتاكيت.",
                "الإضاءة يجب أن تكون 24 ساعة مستمرة في أول 3 أيام لتحفيز سحب العلف.",
                "قدم محلول معالجة الجفاف أو السكر في الماء لأول ساعتين عند الاستلام لحماية الكتاكيت من إجهاد النقل."
            ];
        } else if (day >= 4 && day <= 7) {
            data.temp = "31°C - 30°C";
            data.weight = (day == 7) ? "190 غ" : "120 غ";
            data.feedType = "بادي (23% بروتين)";
            data.feedAmount = "20 - 25 غ";
            data.tips = [
                "في اليوم السابع، يجب عمل وزن عشوائي. الوزن المثالي لكوب 500 هو 180 إلى 200 غرام.",
                "موعد تحصين نيوكاسل + برونشيت (H120) بالرش أو التقطير في العين.",
                "ابدأ بتقليل ساعات الإضاءة تدريجياً لـ 23 ساعة لمنح الطيور ساعة راحة لتفادي الموت المفاجئ."
            ];
        } else if (day >= 8 && day <= 15) {
            data.temp = "29°C - 27°C";
            data.weight = (day <= 11) ? "350 غ" : "500 غ";
            data.feedType = "بادي (23% بروتين)";
            data.feedAmount = "40 - 65 غ";
            data.tips = [
                "اليوم 12 أو 14: انتبه! هذا موعد تحصين الجمبورو (Gumboro) الهام جداً لحماية مناعة القطيع.",
                "تأكد من جفاف الفرشة (التبن/النشارة) وقم بتهوية المكان بلطف لمنع تصاعد غاز الأمونيا.",
                "راقب تجانس القطيع؛ إذا كانت هناك فروق أوزان كبيرة، راجع توزيع المعالف."
            ];
        } else if (day >= 16 && day <= 25) {
            data.temp = "26°C - 24°C";
            data.weight = (day <= 21) ? "950 غ" : "1300 غ";
            data.feedType = "نامي (21% بروتين)";
            data.feedAmount = "85 - 115 غ";
            data.tips = [
                "يتم الانتقال هنا لعلف (النامي). قم بخلط البادي مع النامي لمدة يومين لكي لا تمتنع الطيور عن الأكل.",
                "اليوم 21: الوزن المستهدف لكوب 500 يتخطى 900 غرام إذا كانت الرعاية ممتازة.",
                "احذر من الكوكسيديا والكلوستريديا في هذه الفترة، أضف مضادات السموم الفطرية بانتظام في العلف أو الماء."
            ];
        } else if (day >= 26 && day <= 35) {
            data.temp = "23°C - 22°C";
            data.weight = (day <= 30) ? "1800 غ" : "2300 غ";
            data.feedType = "نامي (21% بروتين)";
            data.feedAmount = "130 - 160 غ";
            data.tips = [
                "مرحلة النمو السريع جداً للهيكل العظمي واللحم. التهوية هي سر النجاح الآن لتوفير الأكسجين وتفادي الاستسقاء.",
                "حافظ على ثبات خطوط المياه ونظافة النبِّل (الحلمات) لضمان استهلاك مياه مريح للوزن الثقيل.",
                "راقب درجات الحرارة بدقة؛ الفروقات الكبيرة بين الليل والنهار تسبب أمراضاً تنفسية معقدة."
            ];
        } else {
            data.temp = "21°C";
            data.weight = (day == 42) ? "2900 غ" : "3200+ غ";
            data.feedType = "ناهي (19% بروتين)";
            data.feedAmount = "170 - 200 غ";
            data.tips = [
                "تغيير العلف إلى (الناهي). انتبه لفترة سحب الأدوية (Withholding Period) لضمان خلو اللحم من متبقيات المضادات الحيوية.",
                "الخطر الأكبر الآن هو الإجهاد الحراري نظراً لضخامة حجم الطائر. شغّل التبريد أو الخلايا وتجنب تحريك الطيور نهاراً.",
                "الدورة في نهايتها؛ راقب معامل التحويل الغذائي (FCR) لمعرفة مدى ربحية الدورة قبل التسويق والبيع."
            ];
        }
        return data;
    }

    function getDailyData() {
        const dayInput = document.getElementById('dayInput').value;
        const day = parseInt(dayInput);

        if (!day || day < 1 || day > 45) {
            alert("يرجى إدخال يوم صحيح بين 1 و 45.");
            return;
        }

        const info = generateCobbData(day);

        document.getElementById('displayDayTitle').innerText = `📋 بيانات وإرشادات اليوم رقم [ ${day} ] للقطيع`;
        document.getElementById('tempVal').innerText = info.temp;
        document.getElementById('weightVal').innerText = info.weight;
        document.getElementById('feedType').innerText = info.feedType;
        document.getElementById('feedAmount').innerText = info.feedAmount;

        const listContainer = document.getElementById('tipsList');
        listContainer.innerHTML = "";
        info.tips.forEach(tip => {
            const li = document.createElement('li');
            li.innerText = tip;
            listContainer.appendChild(li);
        });

        document.getElementById('insightsSection').style.display = "block";
        document.getElementById('aiResponseBox').style.display = "none";
    }

    // اتصال حقيقي ومباشر بـ Groq API باستخدام لغة Llama 3
    async function connectToGroqAI() {
        const day = document.getElementById('dayInput').value;
        const aiBox = document.getElementById('aiResponseBox');
        const aiBtn = document.getElementById('aiBtn');
        
        // جلب البيانات المحلية لإرسالها كسياق للـ AI ليعطي إجابة فائقة الدقة
        const localData = generateCobbData(parseInt(day));

        aiBox.style.display = "block";
        aiBox.innerHTML = "<span class='loading-effect'>جاري إرسال البيانات والاتصال بنموذج Llama 3 عبر خوادم Groq... 🌐</span>";
        aiBtn.disabled = true;

        // إعداد هندسة الأوامر (Prompt Engineering) للتأكد من احترافية الرد
        const systemPrompt = `أنت خبير بيطري ومستشار متخصص في تربية وإدارة سلالة دجاج التسمين Cobb 500. المستخدم هو المربي والمبرمج المحترف "يوسف فارسي". قدم له نصيحة تخصصية متقدمة، مركزة وعملية جداً لـ "اليوم رقم ${day}" من دورة التسمين بناءً على المعطيات التالية لهذا اليوم: (الحرارة: ${localData.temp}، نوع العلف: ${localData.feedType}، الوزن المستهدف: ${localData.weight}). تحدث معه بلهجة تجمع بين الاحترام والخبرة الميدانية العالية، واذكر اسمه "أستاذ يوسف". لا تكرر النصائح السطحية، بل أعطه أسراراً إدارية أو بيطرية دقيقة جداً تخص هذا اليوم بالتحديد.`;

        try {
            const response = await fetch("https://api.groq.com/openai/v1/chat/completions", {
                method: "POST",
                headers: {
                    "Authorization": "Bearer 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", // تم دمج المفتاح الخاص بك هنا بنجاح
                    "Content-Type": "application/json"
                },
                body: JSON.stringify({
                    model: "llama3-8b-8192", // استخدام نموذج Llama 3 السريع والمتطور
                    messages: [
                        { role: "system", content: systemPrompt },
                        { role: "user", content: `أعطني نصيحة الذكاء الاصطناعي المتقدمة لليوم ${day} في مزرعتي.` }
                    ],
                    temperature: 0.7
                })
            });

            if (!response.ok) {
                throw new Error("فشل الاتصال بالخادم. تأكد من صلاحية المفتاح أو اتصال الإنترنت.");
            }

            const result = await response.json();
            const aiText = result.choices[0].message.content;
            
            // عرض النتيجة الفخرية المحدثة بالذكاء الاصطناعي
            aiBox.innerHTML = `<strong>🤖 مستشار كوب 500 الذكي لـ "يوسف فارسي":</strong><br><br>${aiText}`;

        } catch (error) {
            aiBox.innerHTML = `<span style="color: #ef4444;">❌ خطأ أثناء جلب البيانات: ${error.message}</span>`;
        } finally {
            aiBtn.disabled = false;
        }
    }
</script>

</body>
</html>
