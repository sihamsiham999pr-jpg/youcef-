<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>يوسف فارسي - إدارة دواجن كوب 500</title>
    <link href="https://fonts.googleapis.com/css2?family=Aref+Ruqaa:wght@700&family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg-color: #0a0f0d;
            --card-bg: rgba(16, 24, 20, 0.85);
            --neon-green: #39ff14;
            --gold-cobb: #ffd700;
            --text-main: #ffffff;
            --border-neon: rgba(57, 255, 20, 0.3);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Cairo', sans-serif; }

        body { background-color: var(--bg-color); background-image: radial-gradient(circle at 50% 50%, #112217 0%, #0a0f0d 100%); color: var(--text-main); min-height: 100vh; padding: 20px; }

        .container { max-width: 900px; margin: 0 auto; }

        header { text-align: center; margin-bottom: 40px; padding: 20px; border-bottom: 2px dashed var(--border-neon); }

        .main-title { font-family: 'Aref Ruqaa', serif; font-size: 3.5rem; color: var(--gold-cobb); text-shadow: 0 0 20px rgba(255, 215, 0, 0.6); margin-bottom: 5px; }

        .search-zone { background: var(--card-bg); border: 1px solid var(--border-neon); border-radius: 15px; padding: 30px; text-align: center; margin-bottom: 30px; }

        input[type="number"] { width: 120px; background: #000; border: 2px solid var(--border-neon); border-radius: 10px; color: var(--neon-green); font-size: 1.8rem; text-align: center; }

        button { background: linear-gradient(135deg, #1f402b 0%, #0d2617 100%); color: var(--neon-green); border: 1px solid var(--neon-green); padding: 10px 25px; font-weight: bold; border-radius: 10px; cursor: pointer; }

        .dashboard-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 20px; margin-bottom: 30px; }

        .data-card { background: rgba(10, 15, 13, 0.9); border-right: 4px solid var(--neon-green); border-radius: 8px; padding: 20px; text-align: center; }

        .insights-section { background: var(--card-bg); border: 1px solid var(--border-neon); border-radius: 15px; padding: 30px; display: none; }

        .ai-box { background: #000; border: 1px solid #1a3a25; border-radius: 8px; padding: 20px; margin-top: 15px; color: #4ade80; text-align: right; display: none; white-space: pre-line; }

        .loading-effect { animation: blink 1s infinite; }
        @keyframes blink { 0%, 100% { opacity: 0; } 50% { opacity: 1; } }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1 class="main-title">فارسي يوسف</h1>
        <div style="color:var(--neon-green)">تطبيق إدارة دواجن اللحم 🐔 كوب 500</div>
    </header>

    <section class="search-zone">
        <label>أدخل عمر القطيع الحالي (1-45 يوم):</label><br><br>
        <div class="input-group">
            <input type="number" id="dayInput" min="1" max="45">
            <button onclick="getDailyData()">استخراج البيانات الذكية ⚡</button>
        </div>
    </section>

    <section id="insightsSection" class="insights-section">
        <h2 id="displayDayTitle" style="color: var(--gold-cobb);">📋 بيانات اليوم</h2>
        <div class="dashboard-grid">
            <div class="data-card"><h3>درجة الحرارة</h3><p id="tempVal">--</p></div>
            <div class="data-card"><h3>الوزن المستهدف</h3><p id="weightVal">--</p></div>
        </div>
        <ul id="tipsList" style="margin-bottom:20px;"></ul>
        <button id="aiBtn" onclick="connectToGroqAI()" style="width: 100%; border-color: var(--gold-cobb); color: var(--gold-cobb);">🤖 استشارة الذكاء الاصطناعي الحيّة</button>
        <div id="aiResponseBox" class="ai-box"></div>
    </section>
</div>

<script>
    function generateCobbData(day) {
        if (day <= 7) return { temp: "31-33°C", weight: "190g", tips: ["تحصين نيوكاسل", "تقليل الإضاءة تدريجياً"] };
        if (day <= 21) return { temp: "26-29°C", weight: "950g", tips: ["تحصين الجمبورو", "مراقبة الفرشة"] };
        return { temp: "21-23°C", weight: "3000g+", tips: ["تهوية جيدة", "مراقبة فترة سحب الأدوية"] };
    }

    function getDailyData() {
        const day = document.getElementById('dayInput').value;
        const info = generateCobbData(day);
        document.getElementById('displayDayTitle').innerText = `📋 بيانات اليوم [ ${day} ]`;
        document.getElementById('tempVal').innerText = info.temp;
        document.getElementById('weightVal').innerText = info.weight;
        document.getElementById('tipsList').innerHTML = info.tips.map(t => `<li>${t}</li>`).join('');
        document.getElementById('insightsSection').style.display = "block";
    }

    async function connectToGroqAI() {
        const day = document.getElementById('dayInput').value;
        const aiBox = document.getElementById('aiResponseBox');
        aiBox.style.display = "block";
        aiBox.innerHTML = "<span class='loading-effect'>جاري الاتصال بالذكاء الاصطناعي...</span>";
        
        try {
            const response = await fetch("https://api.groq.com/openai/v1/chat/completions", {
                method: "POST",
                mode: "cors",
                headers: {
                    "Authorization": "Bearer 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",
                    "Content-Type": "application/json"
                },
                body: JSON.stringify({
                    model: "llama3-8b-8192",
                    messages: [{ role: "system", content: "أنت خبير دواجن. قدم نصيحة احترافية ليوسف فارسي لليوم " + day }]
                })
            });
            const result = await response.json();
            aiBox.innerHTML = `<strong>نصيحة الخبير:</strong><br>${result.choices[0].message.content}`;
        } catch (e) {
            aiBox.innerHTML = "❌ خطأ في الاتصال. تأكد من أن الـ API Key فعال وأنك تستخدم المتصفح الصحيح.";
        }
    }
</script>
</body>
</html>
